services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexcell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexcell"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    command: python app/migrate.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexcell
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexcell
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    command: python app/worker.py
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"
